name: Update the site

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update scripts
        run: |
          python updates/update_events.py
          python updates/update_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/events.ts src/data/stats.json src/data/stats.ts public/api/events.json public/api/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chroma: update CTFtime event data and stats [automated]"
            git push
          else
            echo "No changes to commit"
          fi
